apis:
- name: Parsyl Platform API
  description: 'Parsyl offers custom API integration into the Parsyl Platform so customers
    and Data Partner Program vendors can push or pull shipment, sensor and condition
    data. Documentation is served from Parsyl''s own docs host, docs.parsyl.com, which
    is fronted by CloudFront and gated by an Amazon Cognito user pool named parsyl-api-docs;
    every path 302s to /auth/login. No public machine-readable contract is published.
    A Parsyl-controlled API host exists at api.parsyl.io (AWS API Gateway, TLS cert
    CN=api.parsyl.io) but it answers every anonymous request with HTTP 403 "Missing
    Authentication Token", and no public Parsyl document names it as the base URL,
    so baseURL is deliberately left unrecorded rather than guessed from the domain.'
  humanURL: https://docs.parsyl.com/
  properties:
  - type: Documentation
    url: https://docs.parsyl.com/
