aid: parsyl
name: Parsyl
description: 'Parsyl Inc. is a Denver, Colorado based technology-enabled cargo insurance
  company for perishable and temperature-sensitive supply chains, with an office in
  London and underwriting capacity placed at Lloyd''s of London. It pairs IoT temperature
  and condition sensors with a data platform that turns shipment telemetry into risk
  insight, and sells that insight back as connected marine cargo insurance products
  — ColdCover cargo insurance, stock throughput, excess stock, legal liability, a
  small-business program, and the cargo market''s first parametric spoilage policy.
  Customers include food, seafood, pharmaceutical, vaccine and semiconductor shippers,
  plus global health programs such as Africa CDC and PFSCM. Parsyl runs a Data Partner
  Program that ingests telemetry from third-party monitoring vendors (Berlinger, Copeland,
  Roambee, Sensitech, Tive) and offers custom API integration so customers can pull
  their own systems'' data into the Parsyl Platform. The API surface is real but is
  documented only to authenticated customers at docs.parsyl.com; no OpenAPI, AsyncAPI,
  MCP server or agent card is published publicly.'
